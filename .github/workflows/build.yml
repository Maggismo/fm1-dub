name: build-firmware
# Builds the installable package (build/amb.fwsc) with JieLi's Linux toolchain and, on main,
# publishes it as a GitHub release: the MEDEKAT edition of DUB-1 (eight dark dub pieces).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  firmware:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pillow numpy
      - name: JieLi toolchain
        run: sh tools/get_toolchain.sh
      - name: "JieLi AC79 SDK files (vendored in assets/jieli, Apache-2.0; build.py checks their SHA-256)"
        run: |
          D=$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools
          mkdir -p $D/cfg
          cp assets/jieli/uboot.boot assets/jieli/cfg_tool.bin $D/
          cp assets/jieli/eq_cfg_hw.bin $D/cfg/
      - name: Build the firmware package (release build: the installer checks its identity)
        run: |
          set +e
          sh ./build.sh --release 1.9.0-medekat > build.log 2>&1
          rc=$?
          tail -n 40 build.log
          [ $rc -ne 0 ] && echo "::error title=build failed::$(grep -v '^\s*$' build.log | tail -n 40 | cut -c1-220 | sed ':a;N;$!ba;s/\n/%0A/g')"
          exit $rc
      - name: Size of the app
        run: ls -l build/amb.bin build/dub-1.9.0-medekat.fwsc build/loader/ota.bin
      - uses: actions/upload-artifact@v4
        with:
          name: dub1-medekat-firmware
          path: build/dub-1.9.0-medekat.fwsc
      - name: Release (main only)
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp build/dub-1.9.0-medekat.fwsc dub1-medekat-${{ github.run_number }}.fwsc
          gh release create "medekat-${{ github.run_number }}" "dub1-medekat-${{ github.run_number }}.fwsc" \
            --title "DUB-1 MEDEKAT build ${{ github.run_number }}" \
            --notes "DUB-1 with eight dark dub pieces (Tiefe, Kammer, Monoton, Nebelbank, Beton, Untergrund, Kaelte, Ruhe). Install from the web installer: https://maggismo.github.io/fm1-dub/install/ (return to the official V15 first). Custom firmware: at your own risk."
      - uses: mymindstorm/setup-emsdk@v14
      - name: "The emulator (the same code in the browser, with these pieces)"
        run: EN_VERSION=1.9.0-medekat sh web/emu/build.sh
      - name: Site (installer, emulator, manual)
        run: python3 tools/make_pages.py build/dub-1.9.0-medekat.fwsc 1.9.0-medekat site
      - name: Publish the site to the gh-pages branch
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
